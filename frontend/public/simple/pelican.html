  <style>
    :root { color-scheme: light; --ink: #334e73; --blue: #2e68e8; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .pelican-scene { width: 100%; height: 100%; display: grid; place-items: center; }
    .pelican-art { display: block; width: 100%; height: 100%; overflow: hidden; }
    .outline { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .spokes { stroke: #9cafd0; stroke-width: 1.25; }
    .wind { fill: none; stroke: #8baee0; stroke-width: 2; stroke-linecap: round; }
    .ground { fill: none; stroke: #9bb5dc; stroke-width: 1.5; stroke-linecap: round; }
    #fish { opacity: 0; }
    #fish-bubbles { opacity: 0; }
    .beak-hit { fill: transparent; stroke: none; pointer-events: all; cursor: pointer; touch-action: manipulation; }
    #beak-button:focus { outline: none; }
    #beak-button:focus-visible .beak-hit { stroke: #3474ed; stroke-width: 2; stroke-dasharray: 5 4; }
    @media (prefers-reduced-motion: reduce) { .pelican-scene { scroll-behavior: auto; } }
  </style>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const rearWheel = $('rear-wheel'), frontWheel = $('front-wheel'), crank = $('crank');
      const rider = $('rider'), head = $('head'), eye = $('eye'), eyeClosed = $('eye-closed');
      const jaw = $('lower-bill'), mouth = $('mouth-inside'), fish = $('fish'), bubbles = $('fish-bubbles');
      const scarfFront = $('scarf-front'), scarfBack = $('scarf-back'), scarfSeam = $('scarf-seam');
      const farEdge = $('far-leg-edge'), farFill = $('far-leg-fill'), farFoot = $('far-foot'), farPedal = $('far-pedal');
      const nearEdge = $('near-leg-edge'), nearFill = $('near-leg-fill'), nearFoot = $('near-foot'), nearPedal = $('near-pedal');
      const roadA = $('road-a'), roadB = $('road-b'), roadC = $('road-c');
      const windA = $('wind-a'), windB = $('wind-b'), windC = $('wind-c'), windD = $('wind-d');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const params = new URLSearchParams(location.search);
      const hostOrigin = new URL(document.baseURI).origin;
      const localFile = new URL(document.baseURI).protocol === 'file:';
      let speed = Math.min(2, Math.max(.3, Number(params.get('speed')) || .6));
      let paused = params.get('paused') === '1', visible = true, raf = 0, previous = 0, elapsed = 0;
      let sceneTime = 0, nextFishAt = 9, fishStartedAt = -Infinity, fishPending = false;
      const tau = Math.PI * 2;
      const clamp = x => Math.max(0, Math.min(1, x));
      const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
      function leg(angle, hipX, hipY, edge, fill, foot, pedal) {
        const x = 321 + Math.cos(angle) * 28;
        const y = 328 + Math.sin(angle) * 28;
        const dx = x - hipX, dy = y - 7 - hipY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const along = (62 * 62 - 64 * 64 + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, 62 * 62 - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        const d = `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} ${x.toFixed(2)} ${(y - 7).toFixed(2)}`;
        edge.setAttribute('d', d); fill.setAttribute('d', d);
        foot.setAttribute('transform', `translate(${x.toFixed(2)} ${(y - 3).toFixed(2)}) rotate(${(Math.sin(angle) * 7).toFixed(2)})`);
        pedal.setAttribute('d', `M${(x - 9).toFixed(2)} ${(y + 4).toFixed(2)}h28`);
      }
      function startFish() {
        if (reduceMotion.matches || sceneTime - fishStartedAt < 2.35) return;
        fishStartedAt = sceneTime;
        nextFishAt = sceneTime + 9;
        fishPending = true;
      }
      function triggerFish() {
        if (reduceMotion.matches) return;
        startFish(); paused = false;
        render(elapsed, sceneTime); sync();
      }
      function render(t, realTime, still = false) {
        const phase = t * tau / 1.85;
        const bob = still ? 0 : Math.sin(phase * 2) * 1.2;
        const wheel = phase * 1.32 * 180 / Math.PI;
        rearWheel.setAttribute('transform', `rotate(${wheel % 360})`);
        frontWheel.setAttribute('transform', `rotate(${wheel % 360})`);
        crank.setAttribute('transform', `rotate(${phase * 180 / Math.PI % 360} 321 328)`);
        rider.setAttribute('transform', `translate(0 ${bob})`);
        leg(phase + Math.PI, 282, 234 + bob, farEdge, farFill, farFoot, farPedal);
        leg(phase, 291, 236 + bob, nearEdge, nearFill, nearFoot, nearPedal);
        const flutter = still ? 0 : Math.sin(t * 5.8) * 5;
        scarfFront.setAttribute('d', `M350 143C310 ${138 + flutter} 287 ${115 - flutter} 247 ${121 + flutter}l12 12-11 8c39-3 65 18 100 16Z`);
        scarfBack.setAttribute('d', `M349 139C312 ${124 - flutter} 291 ${150 + flutter} 258 ${128 - flutter}l8 20c33 13 61-10 83 3Z`);
        scarfSeam.setAttribute('d', `M264 ${131 + flutter * .6}C295 ${132 - flutter} 316 148 340 149`);
        const groundOffset = (t * 74 * tau / 1.85 * 1.32) % 400;
        roadA.setAttribute('transform', `translate(${108 + (400 - groundOffset) % 400} 410)`);
        roadB.setAttribute('transform', `translate(${108 + (550 - groundOffset) % 400} 416)`);
        roadC.setAttribute('transform', `translate(${108 + (680 - groundOffset) % 400} 408)`);
        windA.setAttribute('transform', `translate(${-t * 22 % 32} 0)`);
        windB.setAttribute('transform', `translate(${-t * 18 % 24} 0)`);
        windC.setAttribute('transform', `translate(${-t * 15 % 20} 0)`);
        windD.setAttribute('transform', `translate(${-t * 20 % 25} 0)`);
        windA.style.opacity = .25 + .2 * Math.sin(t * 2);
        windB.style.opacity = .3 + .2 * Math.sin(t * 2 + 1);
        windC.style.opacity = .25 + .2 * Math.sin(t * 2 + 3);
        windD.style.opacity = .2 + .15 * Math.sin(t * 2 + 4);
        const event = realTime - fishStartedAt;
        const active = !still && event < 2.35;
        const open = active ? ease(event / .32) * (1 - ease((event - 1.65) / .5)) : 0;
        jaw.setAttribute('transform', `rotate(${open * 18} 404 101)`);
        mouth.setAttribute('opacity', open);
        mouth.setAttribute('d', `M404 98Q455 101 516 111L${516 - 8 * open} ${111 + 35 * open}Q445 ${118 + 28 * open} 404 108Z`);
        head.setAttribute('transform', `rotate(${-open * 3} 357 126)`);
        const hop = (event - .35) / 1.18;
        if (active && hop > 0 && hop < 1) {
          const arc = Math.sin(hop * Math.PI);
          const x = 455 + 44 * arc + 13 * hop;
          const y = 119 - 88 * arc;
          const rotation = -50 + 240 * hop;
          const scale = .8 + .2 * arc;
          fish.setAttribute('transform', `translate(${x} ${y + bob}) rotate(${rotation}) scale(${scale})`);
          fish.style.opacity = Math.min(1, hop * 15, (1 - hop) * 15);
        } else fish.style.opacity = 0;
        bubbles.style.opacity = active ? Math.max(0, 1 - Math.abs(event - .55) / .35) * .7 : 0;
        bubbles.setAttribute('transform', `translate(0 ${active ? -event * 8 : 0})`);
        const blinkTime = realTime % 4.7;
        const blink = !still && ((blinkTime > 4.48 && blinkTime < 4.65) || (active && event > 2.05 && event < 2.23));
        eye.setAttribute('opacity', blink ? 0 : 1);
        eyeClosed.setAttribute('opacity', blink ? 1 : 0);
      }
      function tick(now) {
        if (!previous) previous = now;
        const delta = Math.min((now - previous) / 1000, .1);
        elapsed += delta * speed;
        sceneTime += delta;
        previous = now;
        if (sceneTime >= nextFishAt) startFish();
        render(elapsed, sceneTime);
        if (fishPending && sceneTime - fishStartedAt >= 2.35) {
          fishPending = false;
          parent.postMessage({type:'skill-pocket:pelican-fish-complete'}, localFile || hostOrigin === 'null' ? '*' : hostOrigin);
        }
        raf = requestAnimationFrame(tick);
      }
      function sync() {
        cancelAnimationFrame(raf); raf = 0; previous = 0;
        if (reduceMotion.matches) render(0, 0, true);
        else if (!paused && visible && !document.hidden) raf = requestAnimationFrame(tick);
      }
      render(0, 0, reduceMotion.matches);
      $('beak-button').addEventListener('click', triggerFish);
      $('beak-button').addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); triggerFish(); }
      });
      document.addEventListener('visibilitychange', sync);
      reduceMotion.addEventListener('change', sync);
      if ('IntersectionObserver' in window) new IntersectionObserver(entries => { visible = entries[0].isIntersecting; sync(); }).observe(document.querySelector('.pelican-scene'));
      window.addEventListener('message', event => {
        if (event.source !== parent || (!localFile && event.origin !== hostOrigin)) return;
        const data = event.data;
        if (!data || data.type !== 'skill-pocket:pelican') return;
        if (typeof data.paused === 'boolean') paused = data.paused;
        if (typeof data.speed === 'number' && Number.isFinite(data.speed)) speed = Math.max(.3, Math.min(2, data.speed));
        if (data.fish === true) triggerFish();
        sync();
      });
      window.addEventListener('pagehide', () => cancelAnimationFrame(raf));
      window.addEventListener('pageshow', sync);
      sync();
    })();
  </script>
</body>
</html>
